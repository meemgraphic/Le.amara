button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}a{color:inherit}:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.nv{display:flex;gap:18px}.nv a,.ic button{text-decoration:none;font-size:14px;white-space:nowrap;position:relative}.nv a:hover,.ic button:hover{text-decoration:underline;text-underline-offset:4px}
.lgi{width:34px;height:34px;border-radius:50%;background:var(--logo) center/cover;display:inline-block;flex:none}.bn{display:flex;align-items:center;gap:8px;text-decoration:none;font:400 26px Italiana,serif;justify-self:center}
.ic{display:flex;gap:16px;justify-self:end;align-items:center}.ic b{font-weight:400}.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.5)}}
.sr{padding:10px 16px 0}.sr input{width:100%;border:0;border-bottom:1px solid var(--ink);background:none;padding:8px 0;border-radius:0}.sr input:focus{outline:0;border-bottom-width:2px}
@media(max-width:700px){header{grid-template-columns:auto 1fr;}.nv{display:none}.bn{justify-self:start}.ic{gap:12px}}
.hero{position:relative;overflow:hidden;margin:12px 16px 0;height:clamp(150px,26vw,280px);background:var(--pe);touch-action:pan-y}
.trk{display:flex;height:100%;transition:transform .8s cubic-bezier(.7,0,.2,1)}.sl{flex:0 0 100%;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--pe),var(--clay))}.sl i{position:absolute;inset:0;background:center/cover}
.hero:before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,#2a1710b0,#2a171000 65%);pointer-events:none}
.ov{position:absolute;z-index:3;left:24px;bottom:18px;right:24px;color:#fff}.ov h1{font-size:clamp(22px,4.4vw,48px);line-height:1;max-width:20ch;text-transform:capitalize}.ov p{font-size:clamp(14px,2vw,20px);color:var(--pe);margin-top:4px}
.ov>*{animation:up .8s cubic-bezier(.2,.7,.2,1) both}.ov p{animation-delay:.12s}@keyframes up{from{opacity:0;transform:translateY(20px)}}
.cta{display:inline-block;margin-top:10px;border-bottom:1px solid var(--pe);color:var(--pe);font-size:14px;text-decoration:none}
.ar{position:absolute;z-index:4;top:50%;width:34px;height:34px;background:#faf1e8cc;font-size:20px;transform:translateY(-50%)}.ar:hover{background:var(--pe)}
.dots{position:absolute;z-index:4;right:14px;bottom:12px;display:flex;gap:6px}.dots button{width:8px;height:8px;background:#fff8}.dots .on{background:var(--pe);width:22px}
.big{font:600 clamp(44px,12vw,150px)/.9 Jost;letter-spacing:-.045em;text-transform:uppercase;padding:44px 16px 10px}.big small{display:block;font:400 14px Jost;letter-spacing:0;text-transform:none;opacity:.7;margin-top:8px}
.sec{font:600 clamp(24px,5vw,40px) Jost;letter-spacing:-.03em;padding:30px 16px 6px}
.cts{display:flex;gap:12px;overflow-x:auto;padding:8px 16px 6px}.ct{flex:0 0 140px;text-align:left;text-decoration:none}.ct i{display:block;aspect-ratio:4/5;background:var(--pe2) center/cover}.ct span{display:block;margin-top:6px;font-size:14px}
.tb{display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}.chips{display:flex;gap:6px;overflow-x:auto;flex:1}.chips button,.tb select{white-space:nowrap;padding:5px 14px;border:1px solid var(--line);background:none;font-size:14px}.chips button:hover{background:var(--pe)}.chips .on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:8px 16px 50px}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s;transition-delay:var(--d,0s)}.rv.in{opacity:1;transform:none}
.card{cursor:pointer;position:relative}.im{position:relative;overflow:hidden;aspect-ratio:4/5;background:var(--pe2)}
.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s}.im .b{opacity:0}.card:hover .im .b{opacity:1}
.card h3{font:400 14px Jost;margin-top:8px;letter-spacing:0}.card p{font-size:14px}.card s{opacity:.5;margin-left:6px}
.heart{position:absolute;z-index:2;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:#faf1e8dd;font-size:16px}.heart.on{color:#b3261e;animation:bump .5s}
.tag{position:absolute;z-index:2;left:0;top:10px;background:var(--ink);color:var(--cream);padding:2px 10px;font-size:12px}.tag.o{background:var(--pe);color:var(--ink)}
.empty{grid-column:1/-1;text-align:center;opacity:.7;padding:60px 0}
footer{margin-top:40px;background:var(--deep);color:var(--pe);padding:44px 5vw 26px}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px;align-items:start}.fg h4{font:400 15px Jost;margin-bottom:12px;color:var(--cream)}
.fg a,.fg button{display:block;text-decoration:underline;text-underline-offset:3px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:5px 0;text-align:left;color:var(--pe);opacity:.9}.fg a:hover,.fg button:hover{opacity:1;color:#fff}
.fb{display:flex;align-items:center;gap:12px;color:var(--cream);text-decoration:none!important;font:400 32px Italiana,serif!important;text-transform:none!important;letter-spacing:0!important}.fb .lgi{width:56px;height:56px}
.fp{font-size:13px;opacity:.85;margin-top:14px;line-height:1.7}
.so{display:flex;gap:10px;flex-wrap:wrap}.so a{width:40px;height:40px;border:1px solid var(--pe);border-radius:50%;display:grid;place-items:center;text-decoration:none!important;padding:0!important}.so a:hover{background:var(--pe);color:var(--deep)}.so svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fl{border-top:1px solid #e7c9af80;margin-top:34px;padding-top:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px}.fl a{text-decoration:none}
@media(max-width:760px){.fg{grid-template-columns:1fr 1fr}.fg>div:first-child{grid-column:1/-1}}
.fab{position:fixed;right:16px;bottom:16px;z-index:15;background:#25d366;color:#fff;padding:11px 18px;border-radius:99px;text-decoration:none;font-weight:500;box-shadow:0 6px 18px #0004}
dialog{margin:auto;width:min(94vw,520px);max-height:92vh;overflow:auto;background:var(--cream);color:var(--ink);border:0;padding:22px;box-shadow:0 30px 80px #0006}dialog[open]{animation:pop .35s cubic-bezier(.2,.8,.2,1)}dialog::backdrop{background:#2a171099}
dialog.side{margin:0 0 0 auto;height:100vh;max-height:100vh}dialog.side[open]{animation:sd .4s cubic-bezier(.2,.8,.2,1)}@keyframes pop{from{opacity:0;transform:translateY(16px)}}@keyframes sd{from{transform:translateX(100%)}}
.gal{width:100%;aspect-ratio:4/5;max-height:52vh;object-fit:cover;display:block}.thm{display:flex;gap:6px;margin:6px 0}.thm img{width:52px;height:64px;object-fit:cover;cursor:pointer;opacity:.6}.thm .on{opacity:1;outline:1px solid var(--ink)}
.sz{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.sz button{min-width:44px;padding:6px 12px;border:1px solid var(--line)}.sz .on{background:var(--ink);color:var(--cream)}
.btn{display:block;width:100%;background:var(--deep);color:var(--cream);padding:13px;font-weight:500;text-align:center;text-decoration:none;margin-top:10px}.btn:hover{background:var(--ink)}.btn.o{background:none;color:var(--ink);border:1px solid var(--ink)}.btn:disabled{opacity:.4}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row img{width:60px;height:76px;object-fit:cover}.row div{flex:1}.q button{width:26px;height:26px;border:1px solid var(--line)}
form input,form textarea{width:100%;background:#fff;border:1px solid var(--line);padding:11px;margin:5px 0;border-radius:0}.x{float:right;font-size:26px;line-height:1}.note{font-size:13px;opacity:.75;margin:8px 0}
.cpn{display:flex;gap:8px}.cpn input{text-transform:uppercase}.cpn button{background:var(--ink);color:var(--cream);padding:0 18px;margin:5px 0}.ok{color:#2f7d32;font-size:14px}.er{color:#b3261e;font-size:14px}
.sm{display:flex;justify-content:space-between;padding:3px 0}
.od{border:1px solid var(--line);padding:14px;margin:12px 0;background:#fff}.stp{display:flex;margin:14px 0 6px}.stp div{flex:1;text-align:center;font-size:12px;position:relative}.stp div:before{content:"";display:block;width:14px;height:14px;border-radius:50%;background:#ddd;margin:0 auto 4px;position:relative;z-index:1}.stp div:after{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:#ddd}.stp div:first-child:after{display:none}.stp .on:before,.stp .on:after{background:var(--clay)}.stp .now:before{box-shadow:0 0 0 4px var(--pe)}
.pb{display:inline-block;padding:2px 12px;font-size:13px;background:#f4d4d4}.pb.y{background:#d8f0d2}
@media(prefers-reduced-motion:reduce){*,:before,:after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

 $("#ft").innerHTML=`<div><a class="fb" href="#top"><span class="lgi"></span>Le.amara</a><p class="fp">${PH}<br>${LOC}</p></div><div><h4>Menu</h4><a href="#shop-top">The collection</a>${(S.categories||[]).map(c=>`<button data-cat="${esc(c)}">${esc(c)}</button>`).join("")}<a href="#" data-a="orders">My orders</a></div><div><h4>Service</h4><a href="https://wa.me/${wn}" target="_blank" rel="noopener">WhatsApp</a><a href="tel:+91${PH}">Call us</a><a href="https://www.google.com/maps/search/${encodeURIComponent(LOC)}" target="_blank" rel="noopener">Find us</a></div><div class="so"><a href="${IG}" target="_blank" rel="noopener" aria-label="Instagram">${ico('<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/>')}</a><a href="https://wa.me/${wn}" target="_blank" rel="noopener" aria-label="WhatsApp">${ico('<path d="M3 21l1.6-4.8A8.5 8.5 0 1 1 8 19.5z"/>')}</a><a href="tel:+91${PH}" aria-label="Call">${ico('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>')}</a></div>`;draw()});
/* hero */
let B=[],bi=0,tm,DEF=[{title:"threads of elegance,",sub:"woven by sisters"}];
onSnapshot(collection(db,"banners"),s=>{B=s.docs.map(d=>d.data()).sort(asc);const L=B.length?B:DEF;
 $("#trk").innerHTML=L.map(x=>`<div class="sl"><i ${x.image?`style="background-image:url('${esc(x.image)}')"`:""}></i></div>`).join("");
 $("#dots").innerHTML=L.length>1?L.map((_,i)=>`<button data-b="${i}" aria-label="Banner ${i+1}"></button>`).join(""):"";document.querySelectorAll(".ar").forEach(a=>a.hidden=L.length<2);show(0)});
function show(i){const L=B.length?B:DEF;bi=(i+L.length)%L.length;clearInterval(tm);$("#trk").style.transform=`translateX(-${bi*100}%)`;
 document.querySelectorAll(".sl").forEach((e,k)=>e.classList.toggle("on",k==bi));document.querySelectorAll("#dots button").forEach((e,k)=>e.classList.toggle("on",k==bi));
 const b=L[bi];$("#ov").innerHTML=`<h1>${esc(b.title)}</h1><p>${esc(b.sub)}</p><a class="cta" href="#shop-top">Shop the collection</a>`;if(L.length>1)tm=setInterval(()=>show(bi+1),5500)}
let tx=0;$("#hero").addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});$("#hero").addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)show(bi+(d<0?1:-1))});
show(0);
/* shop */
const imgs=p=>p.images?.length?p.images:[p.image];
function draw(){const cats=["All",...(S.categories||[])];
 $("#chips").innerHTML=cats.map(c=>`<button class="${!liked&&c==cat?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")+`<button class="${liked?"on":""}" data-a="likedOnly">♡ Liked</button>`;
 const t=(S.categories||[]).map(c=>[c,P.find(p=>p.category==c)]).filter(x=>x[1]);$("#cwrap").hidden=!t.length;$("#cts").innerHTML=t.map(([c,p])=>`<a class="ct" href="#shop-top" data-cat="${esc(c)}"><i style="background-image:url('${esc(imgs(p)[0])}')"></i><span>${esc(c)}</span></a>`).join("");
 let L=P.filter(p=>(liked?likes.includes(p.id):cat=="All"||p.category==cat)&&(!qs||(p.name+" "+(p.category||"")).toLowerCase().includes(qs)));
 if(so=="l")L.sort((a,b)=>a.price-b.price);if(so=="h")L.sort((a,b)=>b.price-a.price);$("#rc").textContent=L.length?L.length+" piece"+(L.length>1?"s":""):"";
 $("#shop").innerHTML=L.length?L.map((p,i)=>{const m=imgs(p),off=p.mrp>p.price?Math.round(100-p.price/p.mrp*100):0;return`<div class="card rv" style="--d:${(i%6)*.07}s" data-id="${p.id}"><div class="im"><img loading="lazy" src="${esc(m[0])}" alt="${esc(p.name)}">${m[1]?`<img class="b" loading="lazy" src="${esc(m[1])}" alt="">`:""}${p.soldOut?'<span class="tag">Sold out</span>':off?`<span class="tag o">${off}% off</span>`:""}<button class="heart ${likes.includes(p.id)?"on":""}" data-like="${p.id}" aria-label="Like">${likes.includes(p.id)?"♥":"♡"}</button></div><h3>${esc(p.name)}</h3><p>${inr(p.price)}${off?`<s>${inr(p.mrp)}</s>`:""}</p></div>`}).join(""):`<p class="empty">${liked?"You haven't liked anything yet.":qs?"No pieces match your search.":"New pieces are on their way."}</p>`;
 $("#lc").textContent=likes.length;$("#cc").textContent=cart.reduce((a,c)=>a+c.q,0);rv()}
$("#q").oninput=e=>{qs=e.target.value.trim().toLowerCase();draw()};$("#so").onchange=e=>{so=e.target.value;draw()};
const total=()=>cart.reduce((a,c)=>a+c.price*c.q,0);
function save(){sv("cart",cart);sv("likes",likes);draw()}
function open(h,c=""){const d=$("#dlg");d.className=c;d.innerHTML=h;if(!d.open)d.showModal()}
const X='<button class="x" data-close aria-label="Close">×</button>';
function product(p){sel=p;size=(p.sizes||[])[0]||"";const m=imgs(p);open(`${X}<img class="gal" id="gal" src="${esc(m[0])}" alt="">${m.length>1?`<div class="thm">${m.map((u,i)=>`<img src="${esc(u)}" data-th="${i}" class="${i?"":"on"}" alt="">`).join("")}</div>`:""}<h2 class="dp" style="font-size:30px;margin-top:10px">${esc(p.name)}</h2><p style="color:var(--clay);font-weight:500">${inr(p.price)}</p><p>${esc(p.desc)}</p>${(p.sizes||[]).length?`<div class="sz">${p.sizes.map(s=>`<button data-size="${esc(s)}" class="${s==size?"on":""}">${esc(s)}</button>`).join("")}</div>`:""}<button class="btn" data-add ${p.soldOut?"disabled":""}>${p.soldOut?"Sold out":"Add to bag"}</button>`)}
function bag(){open(`${X}<h2 class="dp" style="font-size:30px">Your bag</h2>${cart.length?cart.map((c,i)=>`<div class="row"><img src="${esc(c.image)}" alt=""><div>${esc(c.name)}<br><small>${esc(c.size)} · ${inr(c.price)}</small></div><span class="q"><button data-q="${i},-1">−</button> ${c.q} <button data-q="${i},1">+</button></span></div>`).join("")+`<p style="margin-top:14px">Total <b>${inr(total())}</b></p><button class="btn" data-a="checkout">Checkout</button>`:`<p class="empty">Your bag is empty.</p>`}`,"side")}
const disc=()=>{if(!cp)return 0;const t=total();return Math.min(t,Math.round(t*(cp.percent||0)/100)+(cp.flat||0))},pay=()=>total()-disc();
function sumHtml(){return`<div class="sm"><span>Subtotal</span><span>${inr(total())}</span></div>${cp?`<div class="sm ok"><span>Coupon ${esc(cp.code)}</span><span>− ${inr(disc())}</span></div>`:""}<div class="sm"><b>Total</b><b>${inr(pay())}</b></div>`}
function checkout(){open(`${X}<h2 class="dp" style="font-size:30px">Delivery details</h2><form id="f"><input name="name" placeholder="Full name" required><input name="phone" type="tel" placeholder="Phone number" value="${esc(ld("mp",""))}" required><textarea name="address" rows="3" placeholder="Full address with pincode" required></textarea><label class="note">Have a coupon code?</label><div class="cpn"><input id="cc2" placeholder="Enter coupon code" value="${esc(cp?.code||"")}" autocomplete="off"><button type="button" id="ca">Apply</button></div><p id="cm" class="${cp?"ok":""}">${cp?"Coupon applied ✓":""}</p><p class="note">Payment is by UPI. After you place the order we confirm it on WhatsApp and send a UPI QR. Your order ships after payment.</p><div id="sm">${sumHtml()}</div><button class="btn" id="go">Confirm order</button></form>`);
 $("#ca").onclick=async()=>{const c=$("#cc2").value.trim().toUpperCase(),m=$("#cm");if(!c){cp=null;m.className="";m.textContent="";$("#sm").innerHTML=sumHtml();return}
  m.className="";m.textContent="Checking…";try{const s=await getDoc(doc(db,"coupons",c)),d=s.exists()?s.data():null;
   if(!d||d.active===false){cp=null;m.className="er";m.textContent="This coupon code isn't valid."}
   else if(d.validUntil&&new Date(d.validUntil+"T23:59:59")<new Date()){cp=null;m.className="er";m.textContent="This coupon has expired."}
   else{cp={code:c,percent:+d.percent||0,flat:+d.flat||0};m.className="ok";m.textContent="Coupon applied ✓"}}catch{cp=null;m.className="er";m.textContent="Couldn't check the coupon. Try again."}
  $("#sm").innerHTML=sumHtml()};
 $("#f").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),b=$("#go");b.disabled=true;b.textContent="Placing order…";
 try{const o={...f,pay:"UPI",paid:false,phoneKey:f.phone.replace(/\D/g,"").slice(-10),items:cart,subtotal:total(),coupon:cp?cp.code:"",discount:disc(),total:pay(),status:"New",createdAt:serverTimestamp()},r=await addDoc(collection(db,"orders"),o),id=r.id.slice(0,6).toUpperCase();sv("mp",f.phone);
 const msg=`New order #${id} – Le.amara\n${cart.map(c=>`• ${c.name} (${c.size||"-"}) x${c.q} – ${inr(c.price*c.q)}`).join("\n")}\n${cp?`Coupon ${cp.code}: -${inr(o.discount)}\n`:""}Total: ${inr(o.total)}\nPayment: UPI (QR to be sent after confirmation)\n\nName: ${f.name}\nPhone: ${f.phone}\nAddress: ${f.address}`;
 const wa=`https://wa.me/${(S.whatsapp||"").replace(/\D/g,"")}?text=${encodeURIComponent(msg)}`;
 cart=[];cp=null;save();open(`<h2 class="dp" style="font-size:30px">Order placed ✓</h2><p>Order #${id} is saved. Send it on WhatsApp so we can confirm it. We'll reply with a UPI QR, and your order ships after payment.</p><a class="btn" href="${wa}" target="_blank" rel="noopener">Send order on WhatsApp</a><button class="btn o" data-a="orders">Track my order</button><button class="btn o" data-close>Keep shopping</button>`);window.open(wa,"_blank")}
 catch(err){b.disabled=false;b.textContent="Confirm order";alert("Couldn't place the order. Check your connection and try again.")}}}
/* my orders */
const STEPS=["New","Confirmed","Shipped","Delivered"],SL=["Placed","Confirmed","Shipped","Delivered"];
function orders(){open(`${X}<h2 class="dp" style="font-size:30px">My orders</h2><form id="of"><input name="p" type="tel" placeholder="Phone number used for the order" value="${esc(ld("mp",""))}" required><button class="btn">Show my orders</button></form><div id="ol"></div>`);
 const run=async k=>{$("#ol").innerHTML='<p class="note">Looking…</p>';try{const s=await getDocs(query(collection(db,"orders"),where("phoneKey","==",k))),L=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>asc(b,a));
  $("#ol").innerHTML=L.length?L.map(o=>{const st=o.status||"New",i=STEPS.indexOf(st);return`<div class="od"><b>#${o.id.slice(0,6).toUpperCase()}</b> · ${o.createdAt?new Date(o.createdAt.seconds*1000).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):""}<span style="float:right">${inr(o.total)}</span><p class="note">${(o.items||[]).map(x=>`${esc(x.name)} × ${x.q}`).join(", ")}</p>${st=="Cancelled"?'<p class="pb">Cancelled</p>':`<div class="stp">${SL.map((l,k)=>`<div class="${k<=i?"on":""} ${k==i?"now":""}">${l}</div>`).join("")}</div>`}<span class="pb ${o.paid?"y":""}">${o.paid?"Paid ✓":"Awaiting payment"}</span>${st=="Delivered"&&(Date.now()-((o.deliveredAt||o.createdAt)?.seconds||0)*1000)<5*864e5?`<a class="btn o" href="https://wa.me/${(S.whatsapp||"").replace(/\D/g,"")||"91"+PH}?text=${encodeURIComponent("Hi Le.amara, I need help with order #"+o.id.slice(0,6).toUpperCase())}" target="_blank" rel="noopener">Need help? Contact us</a>`:""}${!o.paid&&st!="Cancelled"?'<p class="note">Pay using the UPI QR we send on WhatsApp. Your order ships after payment.</p>':""}</div>`}).join(""):'<p class="note">No orders found for this number.</p>'}catch{$("#ol").innerHTML='<p class="note">Couldn\'t load your orders. Try again.</p>'}};
 $("#of").onsubmit=e=>{e.preventDefault();const p=new FormData(e.target).get("p");sv("mp",p);run(p.replace(/\D/g,"").slice(-10))};if(ld("mp",""))run(ld("mp","").replace(/\D/g,"").slice(-10))}
/* clicks */
document.addEventListener("click",e=>{const t=e.target,g=s=>t.closest(s);
 if(g("[data-close]"))return $("#dlg").close();
 if(g("[data-s]"))return show(bi+ +g("[data-s]").dataset.s);if(g("[data-b]"))return show(+g("[data-b]").dataset.b);
 if(g("[data-like]")){const id=g("[data-like]").dataset.like;likes=likes.includes(id)?likes.filter(x=>x!=id):[...likes,id];return save()}
 if(g("[data-cat]")){e.preventDefault();cat=g("[data-cat]").dataset.cat;liked=false;draw();return $("#chips").scrollIntoView({behavior:"smooth",block:"center"})}
 if(g("[data-th]")){const i=+g("[data-th]").dataset.th;$("#gal").src=imgs(sel)[i];document.querySelectorAll("[data-th]").forEach((x,k)=>x.classList.toggle("on",k==i));return}
 if(g("[data-size]")){size=g("[data-size]").dataset.size;document.querySelectorAll("[data-size]").forEach(b=>b.classList.toggle("on",b.dataset.size==size));return}
 if(g("[data-add]")){const k=cart.find(c=>c.id==sel.id&&c.size==size);k?k.q++:cart.push({id:sel.id,name:sel.name,price:+sel.price,image:imgs(sel)[0],size,q:1});save();$("#cc").classList.remove("bump");void $("#cc").offsetWidth;$("#cc").classList.add("bump");return bag()}
 if(g("[data-q]")){const[i,d]=g("[data-q]").dataset.q.split(",").map(Number);cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);save();return bag()}
 const a=g("[data-a]")?.dataset.a;if(a){e.preventDefault();if(a=="cart")return bag();if(a=="checkout")return checkout();if(a=="orders")return orders();if(a=="likedOnly"){liked=!liked;draw();return $("#chips").scrollIntoView({behavior:"smooth",block:"center"})}}
 if(g(".card")){const p=P.find(x=>x.id==g(".card").dataset.id);p&&product(p)}});
</script></body></html>
